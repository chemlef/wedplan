<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MyWedPlan</title>
  <meta name="description" content="Plan your wedding together: guests, seating, invitations, budget, flowers, menu, vendors and timeline.">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/icon.svg">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    (function () {
      var t = localStorage.getItem('wp_theme') || 'light';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>MyWedPlan needs JavaScript to run.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
